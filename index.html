<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AI半导体今日排行</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0c10;color:#e8ecf4;font-family:'PingFang SC','Hiragino Sans GB',sans-serif;min-height:100vh;padding:0 0 60px}
.inner{max-width:480px;margin:0 auto;padding:24px 16px}
.header{text-align:center;border-bottom:1px solid #1e2330;padding-bottom:20px;margin-bottom:24px}
.tag{display:inline-block;font-size:10px;letter-spacing:3px;color:#00e5a0;border:1px solid #00e5a0;padding:3px 10px;border-radius:2px;margin-bottom:12px;font-family:monospace}
.title{font-size:26px;font-weight:900;letter-spacing:2px;line-height:1.3;color:#fff;margin-bottom:8px}
.sub{font-size:11px;color:#4a5068;font-family:monospace}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.lbl{font-size:13px;color:#7a849c;font-family:monospace}
.toggle{display:flex;background:#111318;border:1px solid #1e2330;border-radius:6px;overflow:hidden}
.toggle button{padding:7px 18px;font-size:12px;border:none;cursor:pointer;background:transparent;color:#7a849c;font-family:inherit;transition:all 0.2s}
.toggle button.au{background:rgba(0,229,160,0.15);color:#00e5a0}
.toggle button.ad{background:rgba(255,77,106,0.15);color:#ff4d6a}
.mbtn{width:100%;padding:15px;background:transparent;border:1px solid #00e5a0;border-radius:10px;color:#00e5a0;font-size:15px;cursor:pointer;margin-bottom:20px;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:1px;font-family:inherit}
.mbtn:disabled{opacity:0.4;cursor:not-allowed}
.spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.card{background:#111318;border:1px solid #1e2330;border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:8px}
.r1{border-left:3px solid gold}
.r2{border-left:3px solid silver}
.r3{border-left:3px solid #cd7f32}
.rank{font-family:monospace;font-size:15px;font-weight:700;color:#4a5068;width:24px;text-align:center;flex-shrink:0}
.r1 .rank{color:gold}.r2 .rank{color:silver}.r3 .rank{color:#cd7f32}
.info{flex:1;min-width:0}
.sname{font-size:15px;font-weight:700;color:#e8ecf4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{margin-top:4px;display:flex;gap:8px;align-items:center}
.scode{font-family:monospace;font-size:11px;color:#7a849c}
.stag{font-size:10px;color:#4a5068;background:rgba(255,255,255,0.05);padding:1px 6px;border-radius:3px}
.right{text-align:right;flex-shrink:0}
.pct{font-family:monospace;font-size:18px;font-weight:700}
.up{color:#00e5a0}.dn{color:#ff4d6a}
.price-row{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:3px}
.price{font-family:monospace;font-size:13px;font-weight:600;color:#e8ecf4}
.chg{font-family:monospace;font-size:11px}
.empty{text-align:center;padding:50px 20px;color:#4a5068}
.empty .icon{font-size:44px;margin-bottom:12px}
.empty p{font-size:13px;line-height:1.9}
.ltips{text-align:center;padding:40px 20px;color:#7a849c;font-size:13px;line-height:2.4}
.ts{text-align:center;font-family:monospace;font-size:11px;color:#4a5068;margin-top:10px}
.err{background:rgba(255,77,106,0.08);border:1px solid rgba(255,77,106,0.2);border-radius:10px;padding:16px;text-align:center;color:#ff4d6a;font-size:13px;line-height:1.8;margin-bottom:16px}
.notice{margin-top:24px;padding:12px 14px;border:1px solid #1e2330;border-radius:8px;font-size:11px;color:#4a5068;line-height:1.9}
.notice strong{color:#7a849c}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:20px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:6px 14px;border-radius:20px;font-size:12px;border:1px solid #1e2330;background:transparent;color:#7a849c;cursor:pointer;font-family:inherit;transition:all 0.2s}
.tab.on{background:#00e5a0;color:#000;border-color:#00e5a0;font-weight:700}
.divider{text-align:center;font-size:11px;color:#2a3040;margin:4px 0 8px;letter-spacing:2px}
</style>
</head>
<body>
<div class="inner">
  <div class="header">
    <div class="tag">AI · MARKET · SCANNER</div>
    <div class="title">🤖 AI半导体<br>今日排行</div>
    <div class="sub">精选股票池 · 东方财富数据</div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab on" data-cat="all">全部</button>
    <button class="tab" data-cat="ai">人工智能</button>
    <button class="tab" data-cat="semi">半导体</button>
    <button class="tab" data-cat="chip">芯片</button>
    <button class="tab" data-cat="compute">算力设备</button>
  </div>

  <div class="row">
    <span class="lbl">TOP 10 排行</span>
    <div class="toggle">
      <button id="btnUp" class="au" onclick="setMode('up')">▲ 涨幅</button>
      <button id="btnDn" onclick="setMode('down')">▼ 跌幅</button>
    </div>
  </div>

  <button class="mbtn" id="mb" onclick="fetchData()">
    <span id="bi">⟳</span>
    <span id="bt">获取今日排行</span>
  </button>

  <div id="content">
    <div class="empty">
      <div class="icon">📡</div>
      <p>点击按钮<br>获取今日AI半导体<br>涨跌幅实时排行</p>
    </div>
  </div>

  <div class="notice">
    <strong>精选股票：</strong>80支核心AI半导体个股<br>
    <strong>数据来源：</strong>东方财富实时行情<br>
    <strong>交易时间：</strong>工作日 9:30–15:00<br>
    <strong>免责声明：</strong>仅供参考，不构成投资建议
  </div>
</div>

<script>
// 精选AI半导体股票池，按细分行业分类
const POOL = {
  ai: [
    {code:'sh688256',name:'寒武纪',sector:'AI芯片'},
    {code:'sh688041',name:'海光信息',sector:'AI芯片'},
    {code:'sh688047',name:'龙芯中科',sector:'CPU'},
    {code:'sz002230',name:'科大讯飞',sector:'AI'},
    {code:'sh688088',name:'虹软科技',sector:'AI视觉'},
    {code:'sz002415',name:'海康威视',sector:'AI安防'},
    {code:'sz002236',name:'大华股份',sector:'AI视觉'},
    {code:'sh688516',name:'奥比中光',sector:'3D视觉'},
    {code:'sz300450',name:'先导智能',sector:'AI装备'},
    {code:'sh688009',name:'中国软件',sector:'信创'},
  ],
  semi: [
    {code:'sh688981',name:'中芯国际',sector:'晶圆代工'},
    {code:'sh600703',name:'三安光电',sector:'半导体'},
    {code:'sh688012',name:'中微公司',sector:'刻蚀设备'},
    {code:'sz002371',name:'北方华创',sector:'半导体设备'},
    {code:'sh688148',name:'芯碁微装',sector:'光刻设备'},
    {code:'sh688819',name:'天岳先进',sector:'碳化硅'},
    {code:'sh688396',name:'华微电子',sector:'功率半导体'},
    {code:'sh603986',name:'兆易创新',sector:'存储芯片'},
    {code:'sz300782',name:'卓胜微',sector:'射频芯片'},
    {code:'sh688521',name:'芯原股份',sector:'IP核'},
  ],
  chip: [
    {code:'sz002049',name:'紫光国微',sector:'安全芯片'},
    {code:'sh688099',name:'晶晨股份',sector:'SoC'},
    {code:'sz300613',name:'富瀚微',sector:'视频芯片'},
    {code:'sz002180',name:'纳思达',sector:'打印芯片'},
    {code:'sh688598',name:'金科环境',sector:'芯片配套'},
    {code:'sh688711',name:'宏微科技',sector:'IGBT'},
    {code:'sz300832',name:'新产业',sector:'芯片检测'},
    {code:'sh688120',name:'华海清科',sector:'CMP设备'},
    {code:'sh688469',name:'芯导科技',sector:'模拟芯片'},
    {code:'sz300760',name:'迈瑞医疗',sector:'芯片应用'},
  ],
  compute: [
    {code:'sh600588',name:'用友网络',sector:'算力软件'},
    {code:'sz000977',name:'浪潮信息',sector:'服务器'},
    {code:'sh601138',name:'工业富联',sector:'算力硬件'},
    {code:'sz300308',name:'中际旭创',sector:'光模块'},
    {code:'sz002281',name:'光迅科技',sector:'光模块'},
    {code:'sh688589',name:'力芯微',sector:'电源芯片'},
    {code:'sh688165',name:'大族激光',sector:'激光设备'},
    {code:'sz300782',name:'卓胜微',sector:'射频'},
    {code:'sh688426',name:'康希通信',sector:'射频芯片'},
    {code:'sz002624',name:'完美世界',sector:'AI应用'},
  ]
};

// 合并去重
POOL.all = Object.values(POOL).flat().filter((s,i,a)=>a.findIndex(x=>x.code===s.code)===i);

let mode='up', cat='all';

document.getElementById('tabs').addEventListener('click',function(e){
  const t=e.target.closest('.tab');
  if(!t)return;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  t.classList.add('on');
  cat=t.dataset.cat;
});

function setMode(m){
  mode=m;
  document.getElementById('btnUp').className=m==='up'?'au':'';
  document.getElementById('btnDn').className=m==='down'?'ad':'';
}

async function fetchData(){
  const mb=document.getElementById('mb');
  const bi=document.getElementById('bi');
  const bt=document.getElementById('bt');
  mb.disabled=true;
  bi.innerHTML='<span class="spin">⟳</span>';
  bt.textContent='加载中...';
  document.getElementById('content').innerHTML=`<div class="ltips">📡 连接服务器...<br>📊 获取精选股票数据...<br>📈 计算TOP 10排行...</div>`;

  const pool=POOL[cat];
  const codes=pool.map(s=>s.code).join(',');

  try{
    const res=await fetch(`/api/stock?codes=${encodeURIComponent(codes)}`);
    const data=await res.json();

    // 合并行情数据和股票信息
    const results=[];
    (data.data?.diff||[]).forEach(item=>{
      const found=pool.find(s=>s.code.replace('sh','').replace('sz','')===(item.f12||''));
      if(!found||item.f3==null||item.f3<=-999)return;
      results.push({
        name:found.name,
        code:item.f12,
        sector:found.sector,
        pct:parseFloat(item.f3),
        price:item.f2>0?(item.f2/100).toFixed(2):'--',
        yest:item.f15>0?(item.f15/100).toFixed(2):null,
      });
    });

    if(!results.length){
      document.getElementById('content').innerHTML=`<div class="err">暂无数据<br>请在交易时段使用（工作日 9:30–15:00）</div>`;
      return;
    }

    // 按涨跌幅排序
    results.sort((a,b)=>mode==='up'?b.pct-a.pct:a.pct-b.pct);

    // 过滤方向：涨幅榜只显示上涨，跌幅榜只显示下跌
    const filtered=mode==='up'
      ? results.filter(s=>s.pct>=0).slice(0,10)
      : results.filter(s=>s.pct<0).slice(0,10);

    if(!filtered.length){
      document.getElementById('content').innerHTML=`<div class="err">${mode==='up'?'暂无上涨股票':'暂无下跌股票'}<br>请稍后刷新</div>`;
      return;
    }

    render(filtered);
  }catch(e){
    document.getElementById('content').innerHTML=`<div class="err">数据获取失败，请稍后重试</div>`;
  }finally{
    mb.disabled=false;
    bi.textContent='⟳';
    bt.textContent='刷新数据';
  }
}

function render(stocks){
  const medals=['🥇','🥈','🥉'];
  let html='';
  stocks.forEach((s,i)=>{
    const isUp=s.pct>=0;
    const pctStr=isUp?`+${s.pct.toFixed(2)}%`:`${s.pct.toFixed(2)}%`;
    const chgAmt=s.yest?(parseFloat(s.price)-parseFloat(s.yest)).toFixed(2):null;
    const chgStr=chgAmt?(parseFloat(chgAmt)>=0?`+${chgAmt}`:`${chgAmt}`):'';
    const rankLabel=i<3?medals[i]:`${i+1}`;
    if(i===3)html+=`<div class="divider">— 4 至 10 名 —</div>`;
    html+=`<div class="card r${Math.min(i+1,4)}">
      <div class="rank">${rankLabel}</div>
      <div class="info">
        <div class="sname">${s.name}</div>
        <div class="meta">
          <span class="scode">${s.code}</span>
          <span class="stag">${s.sector}</span>
        </div>
      </div>
      <div class="right">
        <div class="pct ${isUp?'up':'dn'}">${pctStr}</div>
        <div class="price-row">
          <span class="price">¥${s.price}</span>
          ${chgStr?`<span class="chg ${isUp?'up':'dn'}">${chgStr}</span>`:''}
        </div>
      </div>
    </div>`;
  });
  html+=`<div class="ts">更新时间：${new Date().toLocaleTimeString('zh-CN')} · ${stocks.length}支有效数据</div>`;
  document.getElementById('content').innerHTML=html;
}
</script>
</body>
</html>

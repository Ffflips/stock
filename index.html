.group-tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
.group-tabs::-webkit-scrollbar{display:none}
.gtab{flex-shrink:0;padding:5px 12px;border-radius:4px;font-size:12px;border:1px solid #1e2330;background:transparent;color:#7a849c;cursor:pointer;font-family:inherit;font-weight:600;transition:all 0.2s}
.gtab[data-group="total"].on{background:rgba(180,100,255,0.15);color:#b464ff;border-color:#b464ff}
.gtab[data-group="ai"].on{background:rgba(0,229,160,0.15);color:#00e5a0;border-color:#00e5a0}
.gtab[data-group="material"].on{background:rgba(255,180,0,0.15);color:#ffb400;border-color:#ffb400}
.gtab[data-group="energy"].on{background:rgba(0,180,255,0.15);color:#00b4ff;border-color:#00b4ff}
.gtab[data-group="manufacture"].on{background:rgba(255,77,106,0.15);color:#ff4d6a;border-color:#ff4d6a}
.sub-tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none;min-height:32px}
.sub-tabs::-webkit-scrollbar{display:none}
.stab{flex-shrink:0;padding:5px 12px;border-radius:20px;font-size:11px;border:1px solid #1e2330;background:transparent;color:#7a849c;cursor:pointer;font-family:inherit;transition:all 0.2s}
.stab.on{background:#00e5a0;color:#000;border-color:#00e5a0;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.lbl{font-size:13px;color:#7a849c;font-family:monospace}
.toggle{display:flex;background:#111318;border:1px solid #1e2330;border-radius:6px;overflow:hidden}
.toggle button{padding:6px 16px;font-size:12px;border:none;cursor:pointer;background:transparent;color:#7a849c;font-family:inherit;transition:all 0.2s}
.toggle button.au{background:rgba(0,229,160,0.15);color:#00e5a0}
.toggle button.ad{background:rgba(255,77,106,0.15);color:#ff4d6a}
.mbtn{width:100%;padding:13px;background:transparent;border:1px solid #00e5a0;border-radius:10px;color:#00e5a0;font-size:14px;cursor:pointer;margin-bottom:16px;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:1px;font-family:inherit}
.mbtn:disabled{opacity:0.4;cursor:not-allowed}
.spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.card{background:#111318;border:1px solid #1e2330;border-radius:12px;padding:13px 14px;display:flex;align-items:center;gap:12px;margin-bottom:8px}
.r1{border-left:3px solid gold}.r2{border-left:3px solid silver}.r3{border-left:3px solid #cd7f32}.rn{border-left:3px solid #1e2330}
.rank{font-family:monospace;font-size:14px;font-weight:700;color:#4a5068;width:22px;text-align:center;flex-shrink:0}

.sname{font-size:15px;font-weight:700;color:#e8ecf4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.scode{font-family:monospace;font-size:11px;color:#7a849c}

.gtag{font-size:10px;padding:1px 6px;border-radius:3px}
.right{text-align:right;flex-shrink:0}
.pct{font-family:monospace;font-size:18px;font-weight:700}
.up{color:#00e5a0}.dn{color:#ff4d6a}
.price-row{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:3px}

.chg{font-family:monospace;font-size:11px}
.empty{text-align:center;padding:40px 20px;color:#4a5068}
.empty .icon{font-size:40px;margin-bottom:10px}
.empty p{font-size:13px;line-height:1.9}
.ltips{text-align:center;padding:30px 20px;color:#7a849c;font-size:13px;line-height:2.4}
.ts{text-align:center;font-family:monospace;font-size:11px;color:#4a5068;margin-top:10px}

.notice strong{color:#7a849c}
.divider{text-align:center;font-size:11px;color:#2a3040;margin:4px 0 8px;letter-spacing:2px}

      {code:'sh601989',name:'中国重工',s:'海上无人机'},{code:'sh600150',name:'中国船舶',s:'无人艇'},
      {code:'sz002415',name:'海康威视',s:'无人机视觉'},{code:'sh600316',name:'洪都航空',s:'无人机'},
    ],
    marine:[
      {code:'sh601989',name:'中国重工',s:'海工装备'},{code:'sh600150',name:'中国船舶',s:'船舶制造'},
      {code:'sh601727',name:'上海电气',s:'海工设备'},{code:'sh603699',name:'纽威股份',s:'海工阀门'},
      {code:'sh600308',name:'华泰股份',s:'海工材料'},{code:'sz002202',name:'金风科技',s:'海上风电'},
      {code:'sh601390',name:'中国中铁',s:'海工建设'},{code:'sh600808',name:'马钢股份',s:'海工钢材'},
      {code:'sh600072',name:'中船科技',s:'海工'},{code:'sz000029',name:'深深房A',s:'海工'},
    ],
  }
};

// 每个大板块的all = 所有细分合并去重
Object.keys(POOL).forEach(g => {
  const merged = [];
  const seen = new Set();
  Object.values(POOL[g]).forEach(arr => {
    arr.forEach(s => {
      if (!seen.has(s.code)) { seen.add(s.code); merged.push(s); }
    });
  });
  POOL[g].all = merged;
});

// 总榜 = 所有板块所有股票合并去重
const totalPool = [];
const totalSeen = new Set();
Object.values(POOL).forEach(g => {
  g.all.forEach(s => {
    if (!totalSeen.has(s.code)) { totalSeen.add(s.code); totalPool.push({...s, group: s.group}); }
  });
});
// 给每支股票打上所属大板块标签
['ai','material','energy','manufacture'].forEach(g => {
  POOL[g].all.forEach(s => { s.group = g; });
});

const GROUP_COLORS = {ai:'#00e5a0',material:'#ffb400',energy:'#00b4ff',manufacture:'#ff4d6a'};
const GROUP_NAMES = {ai:'AI半导体',material:'新材料',energy:'新能源',manufacture:'高端制造'};

let mode='up', curGroup='total', curSub='all';

function renderSubTabs(group) {
  const container = document.getElementById('subTabs');
  if (group === 'total') { container.innerHTML = ''; return; }
  const subs = GROUPS[group].subs;
  container.innerHTML = Object.keys(subs).map(k =>
    `<button class="stab ${k===curSub?'on':''}" data-sub="${k}">${subs[k].name}</button>`
  ).join('');
}

document.getElementById('groupTabs').addEventListener('click', function(e) {
  const t = e.target.closest('.gtab');
  if (!t) return;
  document.querySelectorAll('.gtab').forEach(x => x.classList.remove('on'));
  t.classList.add('on');
  curGroup = t.dataset.group;
  curSub = 'all';
  renderSubTabs(curGroup);
  document.getElementById('topLabel').textContent = curGroup==='total' ? 'TOP 10 总榜' : 'TOP 10 排行';
  document.getElementById('content').innerHTML = '<div class="empty"><div class="icon">📡</div><p>点击按钮获取排行</p></div>';
});

document.getElementById('subTabs').addEventListener('click', function(e) {
  const t = e.target.closest('.stab');
  if (!t) return;
  document.querySelectorAll('.stab').forEach(x => x.classList.remove('on'));
  t.classList.add('on');
  curSub = t.dataset.sub;
});

function setMode(m) {
  mode = m;
  document.getElementById('btnUp').className = m==='up' ? 'au' : '';
  document.getElementById('btnDn').className = m==='down' ? 'ad' : '';
}

function getPool() {
  if (curGroup === 'total') {
    const all = [];
    const seen = new Set();
    ['ai','material','energy','manufacture'].forEach(g => {
      POOL[g].all.forEach(s => {
        if (!seen.has(s.code)) { seen.add(s.code); all.push({...s, groupKey:g}); }
      });
    });
    return all;
  }
  return (POOL[curGroup][curSub] || POOL[curGroup].all).map(s => ({...s, groupKey:curGroup}));
}

async function fetchData() {
  const mb = document.getElementById('mb');
  const bi = document.getElementById('bi');
  const bt = document.getElementById('bt');
  mb.disabled = true;
  bi.innerHTML = '<span class="spin">⟳</span>';
  bt.textContent = '加载中...';
  document.getElementById('content').innerHTML = `<div class="ltips">📡 连接服务器...<br>📊 获取实时数据...<br>📈 计算TOP 10排行...</div>`;

  const pool = getPool();
  // 去重
  const seen = new Set();
  const uniq = pool.filter(s => { if(seen.has(s.code)) return false; seen.add(s.code); return true; });
  const codes = uniq.map(s => s.code).join(',');

  try {
    const res = await fetch(`/api/stock?codes=${encodeURIComponent(codes)}`);
    const data = await res.json();
    const diff = data?.data?.diff || [];

    const results = [];
    diff.forEach(item => {
      const found = uniq.find(s => s.code.replace('sh','').replace('sz','') === (item.f12||''));
      if (!found || item.f3==null || item.f3 <= -999) return;
      results.push({
        name: found.name, code: item.f12, sector: found.s,
        groupKey: found.groupKey || curGroup,
        pct: parseFloat(item.f3),
        price: item.f2>0 ? (item.f2/100).toFixed(2) : '--',
        yest: item.f15>0 ? (item.f15/100).toFixed(2) : null,
      });
    });

    if (!results.length) {
      document.getElementById('content').innerHTML = `<div class="err">暂无数据<br>请在交易时段使用（工作日 9:30–15:00）</div>`;
      return;
    }

    results.sort((a,b) => mode==='up' ? b.pct-a.pct : a.pct-b.pct);
    const filtered = mode==='up'
      ? results.filter(s => s.pct > 0).slice(0,10)
      : results.filter(s => s.pct < 0).slice(0,10);

    if (!filtered.length) {
      document.getElementById('content').innerHTML = `<div class="err">${mode==='up'?'暂无上涨股票':'暂无下跌股票'}<br>请稍后刷新</div>`;
      return;
    }
    render(filtered);
  } catch(e) {
    document.getElementById('content').innerHTML = `<div class="err">数据获取失败，请稍后重试</div>`;
  } finally {
    mb.disabled = false;
    bi.textContent = '⟳';
    bt.textContent = '刷新数据';
  }
}

function render(stocks) {
  const medals = ['🥇','🥈','🥉'];
  let html = '';
  stocks.forEach((s,i) => {
    const isUp = s.pct >= 0;
    const pctStr = isUp ? `+${s.pct.toFixed(2)}%` : `${s.pct.toFixed(2)}%`;
    const chgAmt = s.yest ? (parseFloat(s.price)-parseFloat(s.yest)).toFixed(2) : null;
    const chgStr = chgAmt ? (parseFloat(chgAmt)>=0 ? `+${chgAmt}` : `${chgAmt}`) : '';
    const rankLabel = i<3 ? medals[i] : `${i+1}`;
    const rc = i===0?'r1':i===1?'r2':i===2?'r3':'rn';
    const gColor = GROUP_COLORS[s.groupKey] || '#4a5068';
    const gName = GROUP_NAMES[s.groupKey] || '';
    const showGroup = curGroup === 'total';
    if (i===3) html += `<div class="divider">— 4 至 10 名 —</div>`;
    html += `<div class="card ${rc}">
      <div class="rank">${rankLabel}</div>
      <div class="info">
        <div class="sname">${s.name}</div>
        <div class="meta">
          <span class="scode">${s.code}</span>
          <span class="stag2">${s.sector}</span>
          ${showGroup ? `<span class="gtag" style="color:${gColor};background:${gColor}22">${gName}</span>` : ''}
        </div>
      </div>
      <div class="right">
        <div class="pct ${isUp?'up':'dn'}">${pctStr}</div>
        <div class="price-row">
          <span class="price">¥${s.price}</span>
          ${chgStr?`<span class="chg ${isUp?'up':'dn'}">${chgStr}</span>`:''}
        </div>
      </div>
    </div>`;
  });
  html += `<div class="ts">更新时间：${new Date().toLocaleTimeString('zh-CN')} · ${stocks.length}支数据</div>`;
  document.getElementById('content').innerHTML = html;
}

renderSubTabs('total');
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Market Cycle Assistant</title>
<style>
/* 密码锁 */
#lockScreen{position:fixed;inset:0;background:#0a0c10;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column}
.lock-box{text-align:center;padding:32px 28px;background:#111318;border:1px solid #1e2330;border-radius:16px;width:280px}
.lock-icon{font-size:40px;margin-bottom:12px}
.lock-title{font-size:18px;font-weight:900;color:#fff;letter-spacing:2px;margin-bottom:4px}
.lock-sub{font-size:11px;color:#4a5068;margin-bottom:20px;font-family:monospace}
.lock-input{width:100%;padding:12px 16px;background:#0a0c10;border:1px solid #1e2330;border-radius:8px;color:#e8ecf4;font-size:18px;text-align:center;letter-spacing:4px;font-family:monospace;outline:none}
.lock-input:focus{border-color:#00e5a0}
.lock-btn{width:100%;padding:12px;margin-top:12px;background:transparent;border:1px solid #00e5a0;border-radius:8px;color:#00e5a0;font-size:14px;cursor:pointer;font-family:inherit;letter-spacing:1px}
.lock-err{color:#ff4d6a;font-size:11px;margin-top:8px;min-height:16px;font-family:monospace}

*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0c10;color:#e8ecf4;font-family:'PingFang SC','Hiragino Sans GB',sans-serif;min-height:100vh;padding:0 0 80px}
.inner{max-width:520px;margin:0 auto;padding:20px 14px}

/* 头部 */
.header{text-align:center;border-bottom:1px solid #1e2330;padding-bottom:16px;margin-bottom:18px}
.tag{display:inline-block;font-size:9px;letter-spacing:3px;color:#00e5a0;border:1px solid #00e5a0;padding:2px 10px;border-radius:2px;margin-bottom:8px;font-family:monospace}
.title{font-size:22px;font-weight:900;letter-spacing:2px;color:#fff;margin-bottom:4px}
.sub{font-size:10px;color:#4a5068;font-family:monospace}

/* 板块切换 */
.group-tabs{display:flex;gap:6px;margin-bottom:8px;overflow-x:auto;scrollbar-width:none}
.group-tabs::-webkit-scrollbar{display:none}
.gtab{flex-shrink:0;padding:5px 11px;border-radius:4px;font-size:11px;border:1px solid #1e2330;background:transparent;color:#7a849c;cursor:pointer;font-family:inherit;font-weight:600;transition:all 0.2s}
.gtab[data-group="total"].on{background:rgba(180,100,255,0.15);color:#b464ff;border-color:#b464ff}
.gtab[data-group="ai"].on{background:rgba(0,229,160,0.15);color:#00e5a0;border-color:#00e5a0}
.gtab[data-group="material"].on{background:rgba(255,180,0,0.15);color:#ffb400;border-color:#ffb400}
.gtab[data-group="energy"].on{background:rgba(0,180,255,0.15);color:#00b4ff;border-color:#00b4ff}
.gtab[data-group="manufacture"].on{background:rgba(255,77,106,0.15);color:#ff4d6a;border-color:#ff4d6a}
.gtab[data-group="price15"].on{background:rgba(255,215,0,0.15);color:#ffd700;border-color:#ffd700}
.gtab[data-group="price30"].on{background:rgba(0,255,200,0.15);color:#00ffc8;border-color:#00ffc8}
.sub-tabs{display:flex;gap:5px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none;min-height:28px}
.sub-tabs::-webkit-scrollbar{display:none}
.stab{flex-shrink:0;padding:4px 10px;border-radius:16px;font-size:10px;border:1px solid #1e2330;background:transparent;color:#7a849c;cursor:pointer;font-family:inherit;transition:all 0.2s}
.stab.on{background:#00e5a0;color:#000;border-color:#00e5a0;font-weight:700}

/* 控制栏 */
.ctrl-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.lbl{font-size:12px;color:#7a849c;font-family:monospace}
.toggle{display:flex;background:#111318;border:1px solid #1e2330;border-radius:6px;overflow:hidden}
.toggle button{padding:5px 14px;font-size:11px;border:none;cursor:pointer;background:transparent;color:#7a849c;font-family:inherit;transition:all 0.2s}
.toggle button.au{background:rgba(0,229,160,0.15);color:#00e5a0}
.toggle button.ad{background:rgba(255,77,106,0.15);color:#ff4d6a}

/* AI模式切换 */
.mode-row{display:flex;gap:6px;margin-bottom:12px}
.mode-btn{flex:1;padding:7px;font-size:11px;border-radius:6px;border:1px solid #1e2330;background:transparent;color:#7a849c;cursor:pointer;font-family:inherit;text-align:center;transition:all 0.2s}
.mode-btn.on{border-color:#00e5a0;color:#00e5a0;background:rgba(0,229,160,0.08)}

.mbtn{width:100%;padding:12px;background:transparent;border:1px solid #00e5a0;border-radius:10px;color:#00e5a0;font-size:14px;cursor:pointer;margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:1px;font-family:inherit}
.mbtn:disabled{opacity:0.4;cursor:not-allowed}
.spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 股票卡片 */
.card{background:#111318;border:1px solid #1e2330;border-radius:12px;margin-bottom:10px;overflow:hidden}
.r1{border-left:3px solid gold}.r2{border-left:3px solid silver}.r3{border-left:3px solid #cd7f32}.rn{border-left:3px solid #1e2330}
.card-top{padding:12px 14px;display:flex;align-items:center;gap:10px}
.rank{font-family:monospace;font-size:13px;font-weight:700;color:#4a5068;width:20px;text-align:center;flex-shrink:0}
.r1 .rank{color:gold}.r2 .rank{color:silver}.r3 .rank{color:#cd7f32}
.stock-info{flex:1;min-width:0}
.sname{font-size:14px;font-weight:700;color:#e8ecf4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.smeta{margin-top:3px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.scode{font-family:monospace;font-size:10px;color:#7a849c}
.stag2{font-size:9px;color:#4a5068;background:rgba(255,255,255,0.05);padding:1px 5px;border-radius:3px}
.gtag{font-size:9px;padding:1px 5px;border-radius:3px}
.price-block{text-align:right;flex-shrink:0}
.pct{font-family:monospace;font-size:17px;font-weight:700}
.up{color:#00e5a0}.dn{color:#ff4d6a}
.price-row{display:flex;gap:5px;align-items:center;justify-content:flex-end;margin-top:2px}
.price{font-family:monospace;font-size:12px;font-weight:600;color:#e8ecf4}
.chg{font-family:monospace;font-size:10px}

/* AI分析栏 */
.ai-panel{border-top:1px solid #1e2330;padding:10px 14px;background:#0d1018}
.ai-panel.loading{text-align:center;color:#4a5068;font-size:11px;padding:12px}
.ai-row{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;margin-bottom:6px}
.ai-badge{font-size:10px;padding:2px 8px;border-radius:3px;font-weight:700;font-family:monospace;flex-shrink:0}
.badge-buy{background:rgba(0,229,160,0.2);color:#00e5a0;border:1px solid rgba(0,229,160,0.4)}
.badge-hold{background:rgba(64,128,255,0.2);color:#4080ff;border:1px solid rgba(64,128,255,0.4)}
.badge-reduce{background:rgba(255,140,0,0.2);color:#ff8c00;border:1px solid rgba(255,140,0,0.4)}
.badge-exit{background:rgba(255,77,106,0.2);color:#ff4d6a;border:1px solid rgba(255,77,106,0.4)}
.wave-badge{font-size:10px;padding:2px 8px;border-radius:3px;background:rgba(180,100,255,0.15);color:#b464ff;border:1px solid rgba(180,100,255,0.3);font-family:monospace}
.trend-badge{font-size:10px;padding:2px 8px;border-radius:3px;font-family:monospace}
.trend-up{background:rgba(0,229,160,0.1);color:#00e5a0;border:1px solid rgba(0,229,160,0.2)}
.trend-side{background:rgba(255,180,0,0.1);color:#ffb400;border:1px solid rgba(255,180,0,0.2)}
.trend-down{background:rgba(255,77,106,0.1);color:#ff4d6a;border:1px solid rgba(255,77,106,0.2)}
.space-badge{font-size:10px;padding:2px 8px;border-radius:3px;font-family:monospace}
.space-yes{background:rgba(0,229,160,0.08);color:#00e5a0;border:1px solid #1e2330}
.space-end{background:rgba(255,140,0,0.08);color:#ff8c00;border:1px solid #1e2330}
.space-done{background:rgba(255,77,106,0.08);color:#ff4d6a;border:1px solid #1e2330}
.risk-time{font-size:10px;color:#7a849c;margin-top:4px;font-family:monospace;line-height:1.6}
.risk-time span{color:#ffb400}

/* 评分模块 */
.score-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.score-item{display:flex;flex-direction:column;gap:3px}
.score-label{font-size:9px;color:#4a5068;font-family:monospace;display:flex;justify-content:space-between}
.score-label .val{color:#e8ecf4;font-weight:700}
.score-bar{height:4px;background:#1e2330;border-radius:2px;overflow:hidden}
.score-fill{height:100%;border-radius:2px;transition:width 0.6s ease}
.fill-sector{background:linear-gradient(90deg,#ff4d6a,#ffb400,#00e5a0)}
.fill-leader{background:linear-gradient(90deg,#4080ff,#00e5a0)}
.fill-ai{background:linear-gradient(90deg,#b464ff,#00e5a0)}
.growth-row{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.growth-badge{font-size:10px;padding:2px 8px;border-radius:3px;font-weight:700;font-family:monospace}
.growth-high{background:rgba(0,229,160,0.15);color:#00e5a0;border:1px solid rgba(0,229,160,0.3)}
.growth-mid{background:rgba(255,180,0,0.15);color:#ffb400;border:1px solid rgba(255,180,0,0.3)}
.growth-low{background:rgba(122,132,156,0.15);color:#7a849c;border:1px solid rgba(122,132,156,0.3)}
.growth-reason{font-size:10px;color:#7a849c;font-family:monospace}
.ai-score-badge{font-size:11px;padding:2px 9px;border-radius:3px;font-weight:900;font-family:monospace;background:rgba(180,100,255,0.15);color:#b464ff;border:1px solid rgba(180,100,255,0.35)}

/* AI加载动画 */
.ai-loading-row{display:flex;align-items:center;gap:6px;font-size:10px;color:#4a5068}
.dot-anim{display:flex;gap:3px}
.dot-anim span{width:4px;height:4px;background:#4a5068;border-radius:50%;animation:dotpulse 1.2s ease-in-out infinite}
.dot-anim span:nth-child(2){animation-delay:0.2s}
.dot-anim span:nth-child(3){animation-delay:0.4s}
@keyframes dotpulse{0%,80%,100%{opacity:0.3}40%{opacity:1}}

.empty{text-align:center;padding:40px 20px;color:#4a5068}
.empty .icon{font-size:36px;margin-bottom:10px}
.empty p{font-size:12px;line-height:1.9}
.ltips{text-align:center;padding:30px 20px;color:#7a849c;font-size:12px;line-height:2.4}
.ts{text-align:center;font-family:monospace;font-size:10px;color:#4a5068;margin-top:8px}
.err{background:rgba(255,77,106,0.08);border:1px solid rgba(255,77,106,0.2);border-radius:10px;padding:12px;text-align:center;color:#ff4d6a;font-size:12px;line-height:1.8;margin-bottom:12px}
.divider{text-align:center;font-size:10px;color:#2a3040;margin:4px 0 6px;letter-spacing:2px}
.notice{margin-top:18px;padding:10px 12px;border:1px solid #1e2330;border-radius:8px;font-size:10px;color:#4a5068;line-height:1.9}
.notice strong{color:#7a849c}

/* 搜索框 */
.search-box{display:flex;gap:8px;margin-bottom:12px}
.search-box input{flex:1;padding:10px 14px;background:#111318;border:1px solid #1e2330;border-radius:8px;color:#e8ecf4;font-size:13px;font-family:inherit;outline:none}
.search-box input:focus{border-color:#00e5a0}
.search-box button{padding:10px 18px;background:transparent;border:1px solid #00e5a0;border-radius:8px;color:#00e5a0;font-size:13px;cursor:pointer;font-family:inherit}
.search-result-card{background:#111318;border:1px solid #1e2330;border-radius:10px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.search-result-card .info{flex:1;min-width:0}
.search-result-card .sname{font-size:14px;font-weight:700;color:#e8ecf4}
.search-result-card .scode{font-family:monospace;font-size:11px;color:#7a849c;margin-top:2px}
.search-result-card .pct{font-family:monospace;font-size:16px;font-weight:700}
.add-watch-btn{padding:6px 14px;background:transparent;border:1px solid #00e5a0;border-radius:6px;color:#00e5a0;font-size:12px;cursor:pointer;font-family:inherit;flex-shrink:0;white-space:nowrap}
.add-watch-btn.added{border-color:#4a5068;color:#4a5068}
.remove-btn{padding:4px 10px;background:transparent;border:1px solid #ff4d6a;border-radius:6px;color:#ff4d6a;font-size:11px;cursor:pointer;font-family:inherit;flex-shrink:0}
.watch-empty{text-align:center;padding:40px 20px;color:#4a5068}
.watch-empty .icon{font-size:40px;margin-bottom:10px}
.watch-empty p{font-size:13px;line-height:1.9}
</style>
</head>

<div id="lockScreen">

    <div class="lock-icon">🔐</div>
    <div class="lock-title">MARKET CYCLE</div>
    <div class="lock-sub">请输入访问密码</div>
    <input class="lock-input" id="pwInput" type="password" placeholder="••••••" maxlength="20"
      onkeydown="if(event.key==='Enter')checkPw()">
    <button class="lock-btn" onclick="checkPw()">进入系统</button>
    <div class="lock-err" id="pwErr"></div>
  </div>
</div>
<script>
// 修改这里的密码
const PASSWORD = 'ff2026';
function checkPw(){
  const val = document.getElementById('pwInput').value;
  if(val === PASSWORD){
    localStorage.setItem('mca_auth','1');
    document.getElementById('lockScreen').style.display='none';
  } else {
    document.getElementById('pwErr').textContent='密码错误，请重试';
    document.getElementById('pwInput').value='';
    setTimeout(()=>document.getElementById('pwErr').textContent='',2000);
  }
}
// 已登录则直接进入
if(localStorage.getItem('mca_auth')==='1'){
  document.addEventListener('DOMContentLoaded',()=>{
    document.getElementById('lockScreen').style.display='none';
  });
}
</script>

// 带重试的行情数据请求：失败自动重试，最多3次
async function fetchStockData(codes, retries=3){
  let lastErr;
  for(let i=0;i<retries;i++){
    try{
      const res=await fetch(`/api/stock?codes=${encodeURIComponent(codes)}`,{cache:'no-store'});
      if(!res.ok)throw new Error('HTTP '+res.status);
      const data=await res.json();
      const diff=data?.data?.diff||[];
      // 检查是否有有效数据，若全部无效也算失败重试
      const hasValid=diff.some(d=>d.f3!=null);
      if(hasValid || i===retries-1) return data;
      lastErr=new Error('empty data');
    }catch(e){
      lastErr=e;
    }
    if(i<retries-1) await new Promise(r=>setTimeout(r,600));
  }
  throw lastErr||new Error('fetch failed');
}

  } else {
    if(absPct>=5){wave='C浪主跌';trend='down';action='EXIT';riskTime='主跌浪，建议立即关注退出';}
    else if(absPct>=3){wave='A浪开始';trend='down';action='EXIT';riskTime='趋势可能破坏，建议关注';}
    else if(absPct>=1.5){wave='B浪反抽';trend='side';action='REDUCE';riskTime='反弹结构，注意下方风险';}
    else{wave='4浪整理';trend='side';action='HOLD';riskTime='短期整理，趋势未破坏';}
  }

  // 成长空间定性：基于板块分数
  if(sectorScore>=85){growthLevel='高成长';growthReason='主流赛道，景气度高';}
  else if(sectorScore>=70){growthLevel='中成长';growthReason='行业稳健，有政策支撑';}
  else{growthLevel='低成长';growthReason='板块边缘，关注度有限';}

  // 综合评分：主流赛道40% + 龙头强度20% + 成长空间20% + 趋势10% + 波浪10%
  const growthScore=growthLevel==='高成长'?90:growthLevel==='中成长'?65:40;
  const trendScore=trend==='up'?80:trend==='side'?55:25;
  const waveScore=action==='BUY'?80:action==='HOLD'?65:action==='REDUCE'?40:20;
  const aiScore=Math.round(sectorScore*0.4+leaderScore*0.2+growthScore*0.2+trendScore*0.1+waveScore*0.1);

  // 主流赛道判断可能优先于波浪：极强主流赛道下，即使涨幅大也优先HOLD而非急于EXIT
  let finalAction=action;
  if(sectorScore>=88 && action==='REDUCE' && absPct<7){
    finalAction='HOLD';
    riskTime='主流赛道强势，'+riskTime;
  }

  return{sectorScore,leaderScore,growthLevel,growthReason,trend,wave,action:finalAction,riskTime,aiScore};
}

// ============ AI深度分析 ============
async function analyzeWithAI(stocks){
  const res=await fetch('/api/analyze',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({stocks:stocks.map(s=>({name:s.name,code:s.code,pct:s.pct,price:s.price,sector:s.sector}))})
  });
  const data=await res.json();
  if(!data.success)throw new Error(data.error||'AI failed');
  return data.data;
}

// ============ 获取行情数据 ============
function getPool(){
  if(curGroup==='total'){
    const all=[],seen=new Set();
    ['ai','material','energy','manufacture'].forEach(g=>{
      POOL[g].all.forEach(s=>{if(!seen.has(s.code)){seen.add(s.code);all.push({...s,groupKey:g});}});
    });
    return all;
  }
  if(curGroup==='price15'||curGroup==='price30'){
    return PRICE_POOL.map(s=>({...s,groupKey:curGroup}));
  }
  return(POOL[curGroup][curSub]||POOL[curGroup].all).map(s=>({...s,groupKey:curGroup}));
}

async function fetchData(){
  const mb=document.getElementById('mb');
  const bi=document.getElementById('bi');
  const bt=document.getElementById('bt');
  mb.disabled=true;bi.innerHTML='<span class="spin">⟳</span>';

  if(curGroup==='watch'){
    bt.textContent='加载中...';
    await renderWatchlist();
    mb.disabled=false;bi.textContent='⟳';bt.textContent='刷新自选 + 战法分析';
    return;
  }

  bt.textContent='加载中...';
  document.getElementById('content').innerHTML=`<div class="ltips">📡 获取实时行情...<br>🧠 准备战法分析...</div>`;

  const pool=getPool();
  const seen=new Set();
  const uniq=pool.filter(s=>{if(seen.has(s.code))return false;seen.add(s.code);return true;});
  const codes=uniq.map(s=>s.code).join(',');

  try{
    const data=await fetchStockData(codes);
    const diff=data?.data?.diff||[];
    const results=[];
    diff.forEach(item=>{
      const found=uniq.find(s=>s.code.replace('sh','').replace('sz','')===(item.f12||''));
      if(!found||item.f3==null||item.f3<=-9999)return;
      results.push({
        name:found.name,code:item.f12,sector:found.s,groupKey:found.groupKey||curGroup,
        pct:parseFloat(item.f3),
        price:item.f2>0?item.f2.toFixed(2):'--',
        yest:item.f15>0?item.f15.toFixed(2):null,
      });
    });

    if(!results.length){
      document.getElementById('content').innerHTML=`<div class="err">暂无数据，可能是接口波动<br>请点击"刷新数据"重试</div>`;
      return;
    }

    results.sort((a,b)=>mode==='up'?b.pct-a.pct:a.pct-b.pct);

    let filtered;
    if(curGroup==='price15'||curGroup==='price30'){
      // 价格潜力分组：按当前实时价格动态归类，不受交易时段限制
      const priced=results.filter(s=>s.price!=='--'&&parseFloat(s.price)>0);
      const bucket=curGroup==='price15'
        ?priced.filter(s=>parseFloat(s.price)<15)
        :priced.filter(s=>{const p=parseFloat(s.price);return p>=15&&p<=30;});
      filtered=bucket.sort((a,b)=>mode==='up'?b.pct-a.pct:a.pct-b.pct).slice(0,20);
      if(!filtered.length){
        document.getElementById('content').innerHTML=`<div class="err">当前${curGroup==='price15'?'15元以下':'15-30元'}区间暂无标的<br>价格波动会动态调整该列表</div>`;
        return;
      }
    }else{
      const now=new Date(),h=now.getHours(),m2=now.getMinutes(),inSession=(h>9||(h===9&&m2>=30))&&(h<15||(h===15&&m2===0));
      if(inSession){filtered=(mode==='up'?results.filter(s=>s.pct>0):results.filter(s=>s.pct<0)).slice(0,20);}
      else{filtered=[...results].sort((a,b)=>mode==='up'?b.pct-a.pct:a.pct-b.pct).slice(0,20);}
      if(!filtered.length){
        document.getElementById('content').innerHTML=`<div class="err">${mode==='up'?'暂无上涨股票':'暂无下跌股票'}</div>`;
        return;
      }
    }

    // 先渲染行情，AI分析位置先显示loading
    renderCards(filtered,null);

    // 执行AI分析
    if(aiMode==='ai'){
      try{
        const aiResults=await analyzeWithAI(filtered);
        renderCards(filtered,aiResults);
      }catch(e){
        // AI失败降级到规则引擎
        renderCards(filtered,'rule');
      }
    }else{
      renderCards(filtered,'rule');
    }

  }catch(e){
    document.getElementById('content').innerHTML=`<div class="err">数据获取失败，请稍后重试</div>`;
  }finally{
    mb.disabled=false;bi.textContent='⟳';bt.textContent='刷新数据';
  }
}

function getActionBadge(action){
  const map={
    BUY:{cls:'badge-buy',label:'▲ BUY'},
    HOLD:{cls:'badge-hold',label:'◆ HOLD'},
    REDUCE:{cls:'badge-reduce',label:'▼ REDUCE'},
    EXIT:{cls:'badge-exit',label:'✕ EXIT'},
  };
  return map[action]||map['HOLD'];
}
function getTrendBadge(trend){
  if(trend==='up')return{cls:'trend-up',label:'↑ 上升'};
  if(trend==='down')return{cls:'trend-down',label:'↓ 下跌'};
  return{cls:'trend-side',label:'→ 震荡'};
}
function getSpaceBadge(space){
  if(space==='还有')return{cls:'space-yes',label:'空间充足'};
  if(space==='接近结束')return{cls:'space-end',label:'接近结束'};
  return{cls:'space-done',label:'空间耗尽'};
}
function getGrowthBadge(level){
  if(level==='高成长')return{cls:'growth-high',label:'高成长'};
  if(level==='中成长')return{cls:'growth-mid',label:'中成长'};
  return{cls:'growth-low',label:'低成长'};
}
function getFireEmoji(score){
  if(score>=85)return '🔥🔥🔥🔥🔥';
  if(score>=70)return '🔥🔥🔥🔥';
  if(score>=55)return '🔥🔥🔥';
  if(score>=40)return '🔥🔥';
  return '🔥';
}

function renderCards(stocks, aiData, isWatchMode){
  const medals=['🥇','🥈','🥉'];
  const rcs=['r1','r2','r3'];
  let html='';
  stocks.forEach((s,i)=>{
    const isUp=s.pct>=0;
    const pctStr=isUp?`+${s.pct.toFixed(2)}%`:`${s.pct.toFixed(2)}%`;
    const chgAmt=s.yest?(parseFloat(s.price)-parseFloat(s.yest)).toFixed(2):null;
    const chgStr=chgAmt?(parseFloat(chgAmt)>=0?`+${chgAmt}`:`${chgAmt}`):'';
    const rankLabel=i<3?medals[i]:`${i+1}`;
    const rc=i<3?rcs[i]:'rn';
    const gColor=GROUP_COLORS[s.groupKey]||'#4a5068';
    const gName=GROUP_NAMES[s.groupKey]||'';
    const showGroup=curGroup==='total';

    // AI分析结果
    let aiPanel='';
    if(aiData===null){
      aiPanel=`<div class="ai-panel loading"><div class="ai-loading-row"><div class="dot-anim"><span></span><span></span><span></span></div>战法分析中...</div></div>`;
    }else{
      let analysis;
      if(aiData==='rule'){
        analysis=analyzeStock(s);
      }else{
        const found=aiData.find(a=>a.name===s.name);
        analysis=found||analyzeStock(s);
      }
      const ab=getActionBadge(analysis.action);
      const tb=getTrendBadge(analysis.trend);
      const gb=getGrowthBadge(analysis.growthLevel);
      const fire=getFireEmoji(analysis.sectorScore);
      aiPanel=`<div class="ai-panel">
        <div class="ai-row">
          <span class="ai-badge ${ab.cls}">${ab.label}</span>
          <span class="ai-score-badge">AI ${analysis.aiScore}</span>
          <span class="wave-badge">${analysis.wave}</span>
          <span class="trend-badge ${tb.cls}">${tb.label}</span>
          <span class="growth-badge ${gb.cls}">${gb.label}</span>
        </div>
        <div class="score-grid">
          <div class="score-item">
            <div class="score-label"><span>主流赛道 ${fire}</span><span class="val">${analysis.sectorScore}</span></div>
            <div class="score-bar"><div class="score-fill fill-sector" style="width:${analysis.sectorScore}%"></div></div>
          </div>
          <div class="score-item">
            <div class="score-label"><span>龙头强度</span><span class="val">${analysis.leaderScore}</span></div>
            <div class="score-bar"><div class="score-fill fill-leader" style="width:${analysis.leaderScore}%"></div></div>
          </div>
        </div>
        <div class="growth-reason">📊 ${analysis.growthReason}</div>
        <div class="risk-time">⏰ <span>${analysis.riskTime}</span></div>
      </div>`;
    }

    if(i===3)html+=`<div class="divider">— 4 至 20 名 —</div>`;
    html+=`<div class="card ${rc}">
      <div class="card-top">
        <div class="rank">${rankLabel}</div>
        <div class="stock-info">
          <div class="sname">${s.name}</div>
          <div class="smeta">
            <span class="scode">${s.code}</span>
            <span class="stag2">${s.sector}</span>
            ${showGroup?`<span class="gtag" style="color:${gColor};background:${gColor}22">${gName}</span>`:''}
          </div>
        </div>
        <div class="price-block">
          <div class="pct ${isUp?'up':'dn'}">${pctStr}</div>
          <div class="price-row">
            <span class="price">¥${s.price}</span>
            ${chgStr?`<span class="chg ${isUp?'up':'dn'}">${chgStr}</span>`:''}
          </div>
        </div>
        ${isWatchMode?`<button class="remove-btn" onclick="removeFromWatchlist('${s.code}')">移除</button>`:''}
      </div>
      ${aiPanel}
    </div>`;
  });
  html+=`<div class="ts">更新时间：${new Date().toLocaleTimeString('zh-CN')} · ${stocks.length}支 · ${aiMode==='ai'?'AI深度分析':'规则引擎分析'}</div>`;
  document.getElementById('content').innerHTML=html;
}


// ============ 自选股管理 ============
function getWatchlist(){
  try{ return JSON.parse(localStorage.getItem('mca_watchlist')||'[]'); }catch(e){ return []; }
}
function saveWatchlist(list){
  localStorage.setItem('mca_watchlist', JSON.stringify(list));
}
function isInWatchlist(code){
  return getWatchlist().some(s=>s.code===code);
}
function addToWatchlist(stock){
  const list=getWatchlist();
  if(list.some(s=>s.code===stock.code))return;
  list.push({code:stock.code,name:stock.name,sector:stock.sector||'自选',groupKey:'watch'});
  saveWatchlist(list);
}
function removeFromWatchlist(code){
  const list=getWatchlist().filter(s=>s.code!==code);
  saveWatchlist(list);
  if(curGroup==='watch')renderWatchlist();
}

// ============ 搜索股票 ============
async function searchStock(){
  const input=document.getElementById('searchInput').value.trim();
  if(!input)return;
  const resultDiv=document.getElementById('searchResult');
  resultDiv.innerHTML='<div class="ltips">🔍 搜索中...</div>';

  // 判断输入是代码还是名称
  let code=input;
  if(/^\d{6}$/.test(input)){
    // 纯数字代码，自动加前缀
    const prefix=(input.startsWith('6')||input.startsWith('9'))?'sh':'sz';
    code=prefix+input;
  }else if(!/^(sh|sz)\d{6}$/.test(input)){
    // 是名称，需要先查代码 - 用新浪搜索接口
    try{
      const sres=await fetch(`/api/search?q=${encodeURIComponent(input)}`);
      const sdata=await sres.json();
      if(sdata.results && sdata.results.length){
        code=sdata.results[0].code;
      }else{
        resultDiv.innerHTML='<div class="err">未找到该股票，请尝试输入6位代码</div>';
        return;
      }
    }catch(e){
      resultDiv.innerHTML='<div class="err">搜索失败，请输入6位股票代码（如600519）</div>';
      return;
    }
  }

  try{
    const data=await fetchStockData(code);
    const diff=data?.data?.diff||[];
    if(!diff.length){
      resultDiv.innerHTML='<div class="err">未找到该股票数据</div>';
      return;
    }
    const item=diff[0];
    const stock={
      code:item.f12,
      name:item.f14,
      pct:parseFloat(item.f3),
      price:item.f2>0?item.f2.toFixed(2):'--',
      sector:'自选'
    };
    const isUp=stock.pct>=0;
    const pctStr=isUp?`+${stock.pct.toFixed(2)}%`:`${stock.pct.toFixed(2)}%`;
    const inList=isInWatchlist(code);
    resultDiv.innerHTML=`<div class="search-result-card">
      <div class="info">
        <div class="sname">${stock.name}</div>
        <div class="scode">${stock.code} · ¥${stock.price}</div>
      </div>
      <div class="pct ${isUp?'up':'dn'}">${pctStr}</div>
      <button class="add-watch-btn ${inList?'added':''}" onclick="handleAddWatch('${code}','${stock.name}')" id="addBtn-${code}">
        ${inList?'已添加':'+ 自选'}
      </button>
    </div>`;
  }catch(e){
    resultDiv.innerHTML='<div class="err">数据获取失败</div>';
  }
}

function handleAddWatch(code,name){
  addToWatchlist({code,name,sector:'自选'});
  const btn=document.getElementById(`addBtn-${code}`);
  if(btn){ btn.textContent='已添加'; btn.classList.add('added'); }
}

// ============ 渲染自选股 ============
async function renderWatchlist(){
  const list=getWatchlist();
  if(!list.length){
    document.getElementById('content').innerHTML=`<div class="watch-empty">
      <div class="icon">⭐</div>
      <p>暂无自选股<br>在上方搜索框输入股票代码或名称<br>点击"+ 自选"加入观察列表</p>
    </div>`;
    return;
  }
  document.getElementById('content').innerHTML=`<div class="ltips">📡 加载自选股数据...</div>`;

  const codes=list.map(s=>s.code).join(',');
  try{
    const data=await fetchStockData(codes);
    const diff=data?.data?.diff||[];
    const results=[];
    diff.forEach(item=>{
      const found=list.find(s=>s.code.replace('sh','').replace('sz','')===(item.f12||''));
      if(!found||item.f3==null)return;
      results.push({
        name:found.name,code:item.f12,sector:found.sector,groupKey:'watch',
        pct:parseFloat(item.f3),
        price:item.f2>0?item.f2.toFixed(2):'--',
        yest:item.f15>0?item.f15.toFixed(2):null,
      });
    });

    if(!results.length){
      document.getElementById('content').innerHTML='<div class="err">暂无数据，请在交易时段使用</div>';
      return;
    }

    renderCards(results,null,true);

    if(aiMode==='ai'){
      try{
        const aiResults=await analyzeWithAI(results);
        renderCards(results,aiResults,true);
      }catch(e){
        renderCards(results,'rule',true);
      }
    }else{
      renderCards(results,'rule',true);
    }
  }catch(e){
    document.getElementById('content').innerHTML='<div class="err">数据获取失败</div>';
  }
}
